server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's default (1M) is smaller than a lot of real course PDFs
    # (scanned textbook chapters especially) — raise it for /upload.
    client_max_body_size 50M;

    # Reverse-proxy API calls to the backend container by its Docker network
    # service name — the browser only ever talks to this nginx origin, never
    # directly to the backend, so there's no cross-origin request involved.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
